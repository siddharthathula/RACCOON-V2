# RACCOON V2 - fuel, ignition, closed-loop air/fuel, knock, idle, boost, VVT,
# flex fuel and drivetrain.
# Single source of truth for the firmware image and the tuner. See docs/CALIBRATION_SPEC.md.
schema_version: 1

groups:
  - name: fuel
    base_id: 0x0700
    items:
      # ms = (fuel_mass / (flow * pressure_comp * battery_comp)) * 1000
      #      + dead_time(battery) + small_pulse_comp
      # clamped to [min_pulse, max_pulse]. Every term is a named, bounded, logged
      # function - there is no hidden multiplier. See docs/FUEL_SPEC.md sec.5.
      - name: injector_flow_cc_per_s
        id: 0x0700
        type: f32
        unit: "cc/s"
        default: 10.0
        min: 0.5
        max: 200.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Static flow rate at the reference pressure below. This is a *measured* number
          in a finished product (bench flow test or datasheet); until then it is an
          unverified placeholder and the ECU says so. Register UNK-GT-004.
        dependencies: [injector_reference_pressure_kpa]
      - name: injector_reference_pressure_kpa
        id: 0x0701
        type: f32
        unit: kPa
        default: 300.0
        min: 100.0
        max: 1000.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          The pressure at which injector_flow_cc_per_s was measured. Flow and pressure
          are meaningless apart: quoting one without the other is a hidden calibration.
      - name: injector_dead_time_ms
        id: 0x0702
        type: f32
        unit: ms
        default: 1.0
        min: 0.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Dead time at the nominal battery voltage: the pulse that opens the injector but
          delivers no measurable fuel. Must be strictly less than the minimum pulse, and
          a real dead-time curve is monotonic in battery voltage (test F1).
      - name: injector_min_pulse_ms
        id: 0x0703
        type: f32
        unit: ms
        default: 1.2
        min: 0.1
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Smallest pulse the driver will accept, measured. Small-pulse compensation is
          applied only above this and never below it, so the injector is never asked for
          a pulse it cannot deliver.
      - name: injector_max_pulse_ms
        id: 0x0704
        type: f32
        unit: ms
        default: 30.0
        min: 1.0
        max: 200.0
        owner: TUNER
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Software pulse ceiling, always below the duty ceiling expressed as time. This
          is one of the two independent brakes on over-fuelling (the other is
          safety.injector_duty_max_pct); hazard H-05.
      - name: injector_dead_time_battery_slope
        id: 0x0705
        type: f32
        unit: "ms/V"
        default: 0.02
        min: -0.5
        max: 0.5
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          How dead time moves with battery voltage. A sagging pack opens the injector
          more slowly, so the pulse must widen; without this the engine goes lean every
          time the starter or a big injector pulse drags the rail down (test F4).
      - name: injector_battery_comp_pct_per_v
        id: 0x0706
        type: f32
        unit: "%/V"
        default: 1.5
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Additional pulse-width compensation per volt away from the nominal rail.
          Deliberately small: the dominant battery effect is dead time, not driver
          resistance, and over-compensating is how a crank-start transient floods.
      - name: injector_pressure_comp_pct_per_bar
        id: 0x0707
        type: f32
        unit: "%/bar"
        default: 3.0
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Pulse-width correction per bar of deviation from the reference pressure. The
          physics is sqrt(P) for an orifice; this is the linearised, measured form of
          it, and a linear gain hides the fact that the true curve is a square root.
      - name: injector_small_pulse_comp_pct
        id: 0x0708
        type: f32
        unit: "%"
        default: 0.0
        min: 0.0
        max: 50.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Shortening or widening applied in the dead-time-dominated region only. Disabled
          while a fuel cut is active: compensation must never resurrect a cut event
          (FUEL-001 sec.5).
      - name: staged_split_fraction
        id: 0x0709
        type: f32
        unit: frac
        default: 0.5
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Fraction of the demanded fuel mass delivered by the *primary* injector; the
          remainder goes to the secondary. Both are subject to the same min/max pulse,
          duty ceiling and fuel-cut gate - staged injection is a split, not an exemption.
      - name: staged_activate_rpm
        id: 0x070A
        type: u16
        unit: rpm
        default: 4000
        min: 0
        max: 20000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: staged_activate_load_pct
        id: 0x070B
        type: f32
        unit: "%"
        default: 70.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: staged_activate_primary_duty_pct
        id: 0x070C
        type: f32
        unit: "%"
        default: 60.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Activation predicate term. Above this, single injector flow would be outside
          the linear range the flow number was measured over, so the split turns on.
      - name: staged_activate_boost_kpa
        id: 0x070D
        type: f32
        unit: kPa
        default: 100.0
        min: 0.0
        max: 500.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: staged_activate_ect_c
        id: 0x070E
        type: f32
        unit: "degC"
        default: 40.0
        min: -50.0
        max: 150.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Cold engines use large pulses; staged injection is normally inhibited until
          warm, because two small cold pulses are harder to model than one large one.
      - name: transient_tps_gain
        id: 0x070F
        type: f32
        unit: "%/pct"
        default: 0.5
        min: 0.0
        max: 5.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Enrichment added per percentage point of *excess* throttle rate above the
          threshold. Bounded, decayed and logged; a term with no bound is a prohibited
          defect (FUEL-001 sec.6).
      - name: transient_tps_threshold
        id: 0x0710
        type: f32
        unit: "%/s"
        default: 100.0
        min: 0.0
        max: 2000.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: transient_tps_tau_ms
        id: 0x0711
        type: u16
        unit: ms
        default: 200
        min: 10
        max: 5000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Decay time constant of the enrichment accumulator. Not a filter delay.
      - name: transient_tps_max_pct
        id: 0x0712
        type: f32
        unit: "%"
        default: 30.0
        min: 0.0
        max: 200.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: transient_map_gain
        id: 0x0713
        type: f32
        unit: "%/kPa"
        default: 0.05
        min: 0.0
        max: 2.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Pressure-based transient gain, used where throttle rate is a poor predictor -
          drive-by-wire, or a MAP sensor behind a plenum with poor resolution.
      - name: transient_map_threshold
        id: 0x0714
        type: f32
        unit: "kPa/s"
        default: 150.0
        min: 0.0
        max: 5000.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: transient_map_tau_ms
        id: 0x0715
        type: u16
        unit: ms
        default: 150
        min: 10
        max: 5000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: transient_map_max_pct
        id: 0x0716
        type: f32
        unit: "%"
        default: 25.0
        min: 0.0
        max: 200.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: transient_tip_in_gain_pct
        id: 0x0717
        type: f32
        unit: "%"
        default: 8.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Discrete tip-in addition on a throttle opening above the threshold. Separate
          from the rate-based term so a tuner can take one out without losing the other.
      - name: transient_tip_out_gain_pct
        id: 0x0718
        type: f32
        unit: "%"
        default: 6.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Tip-out pulse *reduction*, toward -not-absolutely-zero: the pulse is never
          driven below the minimum pulse by this term, and a fuel cut always wins.
      - name: wall_wet_tau_ms
        id: 0x0719
        type: u16
        unit: ms
        default: 300
        min: 10
        max: 20000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Time constant of the wall-wetting film state variable. Register UNK-FW-007 -
          the film model form for a motorcycle injector is literature only and has not
          been measured on this engine.
      - name: wall_wet_max_pct
        id: 0x0720
        type: f32
        unit: "%"
        default: 15.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: Bounded film mass, so a wet port cannot justify an unbounded pulse.
      - name: decel_cut_tps_pct
        id: 0x0721
        type: f32
        unit: "%"
        default: 2.0
        min: 0.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Closed-throttle threshold for the overrun fuel cut. The cut decision is made
          once, in a dedicated arbiter, and applied as a hard gate at the output stage
          after every other calculation (FUEL-001 sec.7).
      - name: decel_cut_map_kpa
        id: 0x0722
        type: f32
        unit: kPa
        default: 45.0
        min: 0.0
        max: 120.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Manifold threshold for the overrun cut. TPS alone is a poor overrun detector
          under drive-by-wire or with a sloppy linkage, so pressure is the second term.
      - name: decel_cut_reintro_rpm
        id: 0x0723
        type: u16
        unit: rpm
        default: 1800
        min: 0
        max: 20000
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Reintroduction requires rpm above this AND the hysteresis timer elapsed AND
          throttle or MAP above the threshold AND the clutch/gear condition satisfied -
          all four, not any one.
      - name: decel_cut_hysteresis_ms
        id: 0x0724
        type: u16
        unit: ms
        default: 250
        min: 0
        max: 10000
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Without hysteresis a chattering throttle re-opens and closes the injector every
          few cycles, which is how a saturated driver dies.
      - name: enrichment_accumulator_max_pct
        id: 0x0725
        type: f32
        unit: "%"
        default: 50.0
        min: 0.0
        max: 200.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Ceiling on the single enrichment accumulator. There is exactly one accumulator;
          independent enrichers must not be able to stack silently (FUEL-001 sec.6).
      - name: ve_table
        id: 0x0726
        type: table2d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_rows: 16
        alloc_cols: 16
        cell_type: u8
        cell_min: 20.0
        cell_max: 200.0
        default_fill: 70
        description: >-
          Volumetric efficiency, rpm x manifold pressure, in percent.  Ships as a FLAT
          placeholder: 70 % everywhere.  That is a conservative starting point, not a
          calibration - a flat table means every cylinder and every region gets the same
          airflow assumption, which is safe and obviously wrong in the detail, and it is
          tagged UNVERIFIED so the ECU flags it in use outside bench or dyno mode.
          A zero-filled table is NOT acceptable: it would command no air, and therefore
          no fuel, which is why the generator supports an explicit fill value.
        row_axis: rpm
        col_axis: map_kpa
        description: >-
          Volumetric efficiency, 0..200 %, against rpm and manifold pressure. The axis
          values come from companion dimension items so a 2-cylinder build drives the
          same allocation over a narrower range. Interpolated bilinearly with axis
          monotonicity validated; a non-monotonic axis is refused at write time.

      - name: ve_table_rpm_axis
        id: 0x072E
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 16
        cell_type: u16
        cell_min: 1000
        cell_max: 12000
        axis_first: 1000
        unit: rpm
        description: >-
          rpm breakpoints for ve_table: 16 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.

      - name: ve_table_map_kpa_axis
        id: 0x072F
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 16
        cell_type: u16
        cell_min: 20
        cell_max: 250
        axis_first: 20
        unit: kPa
        description: >-
          map_kpa breakpoints for ve_table: 16 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.
      - name: target_lambda_table
        id: 0x0727
        type: table2d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_rows: 8
        alloc_cols: 8
        cell_type: f32
        cell_min: 0.65
        cell_max: 1.15
        row_axis: rpm
        col_axis: load_pct
        default_fill: 0.90
        description: >-
          Target lambda against rpm and load. The commanded value is this table times
          the ethanol blend correction, times the mode target, plus the temperature
          correction and the bounded closed-loop bias - in that order, and finally
          clamped by the lean safety envelope (hazard H-05 / test F17).

      - name: target_lambda_table_rpm_axis
        id: 0x0730
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 1000
        cell_max: 12000
        axis_first: 1000
        unit: rpm
        description: >-
          rpm breakpoints for target_lambda_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.

      - name: target_lambda_table_load_pct_axis
        id: 0x0731
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 0
        cell_max: 100
        axis_first: 0
        unit: pct
        description: >-
          load_pct breakpoints for target_lambda_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.
      - name: target_lambda_bias
        id: 0x071A
        type: f32
        unit: lambda
        scale: 1.0
        default: 0.0
        min: -0.20
        max: 0.20
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Additive bias on the target lambda, clamped by the lambda target bias limits.
          Separate from the closed-loop correction so a tuner can see the commanded target
          and the measured correction as two different numbers in a log.

      - name: target_lambda_cold_ect_c
        id: 0x071B
        type: f32
        unit: C
        scale: 1.0
        default: 40.0
        min: -20.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Engine temperature below which the target lambda is enriched for cold running.
          A failed ECT sensor therefore cannot command an absurdly rich mixture, because
          the enrichment is bounded by cold_ect_c and cold_gain together.

      - name: target_lambda_cold_gain
        id: 0x071C
        type: f32
        unit: frac
        scale: 1.0
        default: 0.35
        min: 0.0
        max: 0.50
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Strength of cold enrichment as a fraction of the temperature distance below
          cold_ect_c. Capped at 0.5, so cold enrichment can at most halve the target
          lambda and never invert it.

      - name: target_lambda_baro_gain
        id: 0x071D
        type: f32
        unit: frac
        scale: 1.0
        default: 1.0
        min: 0.5
        max: 1.5
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Altitude compensation gain: the factor applied per 100 kPa of barometric deficit.
          1.0 disables it, which is the correct setting when the ECU has learned its baro
          at key-on from a MAP sensor on the manifold.

      - name: fuel_strategy
        id: 0x0728
        type: enum
        default: 0
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Load estimator. Every strategy reports (value, source, confidence) and a
          strategy whose sensor is invalid fails to a declared fallback recorded in the
          correction vector - it never silently produces a number (FUEL-001 sec.2).
        values:
          - {name: speed_density, value: 0, description: MAP minus baro - the motorcycle default}
          - {name: alpha_n, value: 1, description: MAP only, absorbs drift, no baro needed}
          - {name: maf, value: 2, description: Direct air mass, best absolute measurement}
          - {name: hybrid, value: 3, description: Calibrated MAP/TPS blend, not a hidden average}
      - name: fuel_hybrid_map_weight
        id: 0x0729
        type: f32
        unit: frac
        default: 0.8
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Weight on the MAP term in hybrid. A named, calibrated, logged term - the point
          of listing it separately is that it is not hidden inside an average.
      - name: learner_enabled
        id: 0x072A
        type: bool
        default: 0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          4D long-term learner. Off by default: convergence and drift in traffic are
          unproven for this engine, and a self-inflicted lean is worse than a static
          error. Register UNK-FW-011.
      - name: learner_trim_max_pct
        id: 0x072B
        type: f32
        unit: "%"
        default: 20.0
        min: 0.0
        max: 50.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Absolute bound on any learned trim. On reaching it the cell freezes and raises
          a DTC; it never continues to walk (test F16).
      - name: learner_rate_limit_pct_per_s
        id: 0x072C
        type: f32
        unit: "%/s"
        default: 1.0
        min: 0.01
        max: 20.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: learner_drift_alarm_pct
        id: 0x072D
        type: f32
        unit: "%"
        default: 10.0
        min: 1.0
        max: 50.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          If the *average* learned trim across the table exceeds this, the ECU raises a
          drift alarm: that pattern indicates a sensor or fuel problem, not a calibration
          that wants updating.

  - name: ignition
    base_id: 0x0800
    items:
      # The firmware produces a *command*; the driver topology decides what the command
      # means. See docs/IGNITION_SPEC.md.
      - name: ignition_base_table
        id: 0x0800
        type: table2d
        owner: TUNER
        safety_class: CRITICAL
        default_source: UNVERIFIED
        alloc_rows: 16
        alloc_cols: 16
        cell_type: f32
        cell_min: -10.0
        cell_max: 35.0
        row_axis: rpm
        col_axis: load_pct
        default_fill: 10.0
        description: >-
          Base advance in crank degrees BTDC. Every correction is added to this and the
          sum is clamped by the hard safety envelope *last*, so no combination of
          corrections and user trim can push past it (hazard H-02, test I12).

      - name: ignition_base_table_rpm_axis
        id: 0x0812
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 16
        cell_type: u16
        cell_min: 1000
        cell_max: 12000
        axis_first: 1000
        unit: rpm
        description: >-
          rpm breakpoints for ignition_base_table: 16 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.

      - name: ignition_base_table_load_pct_axis
        id: 0x0813
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 16
        cell_type: u16
        cell_min: 0
        cell_max: 100
        axis_first: 0
        unit: pct
        description: >-
          load_pct breakpoints for ignition_base_table: 16 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.
      - name: dwell_table
        id: 0x0801
        type: table2d
        owner: TUNER
        safety_class: CRITICAL
        default_source: UNVERIFIED
        alloc_rows: 8
        alloc_cols: 8
        cell_type: f32
        cell_min: 1.0
        cell_max: 8.0
        row_axis: battery_v
        col_axis: rpm
        default_fill: 2.0
        description: >-
          Commanded dwell in ms against battery voltage and rpm. The physics underneath
          is primary - primary inductance, resistance, target current - but the shipped
          default is unverified until it is measured with a current probe on a real
          coil. Register UNK-GT-006.

      - name: dwell_table_volt_axis
        id: 0x0814
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 8
        cell_max: 18
        axis_first: 8
        unit: V
        description: >-
          volt breakpoints for dwell_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.

      - name: dwell_table_rpm_axis
        id: 0x0815
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 1000
        cell_max: 12000
        axis_first: 1000
        unit: rpm
        description: >-
          rpm breakpoints for dwell_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.
      - name: dwell_min_ms
        id: 0x0802
        type: f32
        unit: ms
        default: 1.0
        min: 0.1
        max: 5.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Software floor. Below this a coil does not reach primary current and there is
          no spark at all, so commanding less wastes the event.
      - name: dwell_max_ms
        id: 0x0803
        type: f32
        unit: ms
        default: 8.0
        min: 1.0
        max: 20.0
        owner: TUNER
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Software ceiling. Must not exceed the hardware-enforced value in
          hardware.ignition_max_dwell_ms, and the two are independent by design: a hung
          CPU must still be unable to cook a coil.
      - name: coil_on_timeout_ms
        id: 0x0804
        type: f32
        unit: ms
        default: 20.0
        min: 1.0
        max: 100.0
        owner: TUNER
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Independent watchdog on total coil-on time, separate from the dwell control
          logic and from the main loop. Sync loss during dwell de-energises the coil
          immediately; no stored energy is left in it (test I6).
      - name: ignition_cyl0_trim_deg
        id: 0x0805
        type: f32
        unit: deg
        default: 0.0
        min: -10.0
        max: 10.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Per-cylinder timing trim, applied before the safety clamp. A parallel twin with
          a shared exhaust can genuinely need a split; a four with equal lengths must
          be left at zero rather than trimmed by feel.
      - name: ignition_cyl1_trim_deg
        id: 0x0806
        type: f32
        unit: deg
        default: 0.0
        min: -10.0
        max: 10.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: ignition_cyl2_trim_deg
        id: 0x0807
        type: f32
        unit: deg
        default: 0.0
        min: -10.0
        max: 10.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: ignition_cyl3_trim_deg
        id: 0x0808
        type: f32
        unit: deg
        default: 0.0
        min: -10.0
        max: 10.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: ignition_high_rpm_retard
        id: 0x0809
        type: f32
        unit: "deg/1000rpm"
        default: 1.0
        min: 0.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Retard applied per 1000 rpm above the point the available spark energy stops
          keeping up. Rather than being hidden in the map, it is a named term in the
          correction vector.
      - name: ignition_iat_correction_deg
        id: 0x080A
        type: f32
        unit: deg
        default: -2.0
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Timing correction at the hot end of the intake-air range; normally negative,
          because warm dense charge burns faster. The magnitude is engine-specific.
      - name: ignition_ect_correction_deg
        id: 0x080B
        type: f32
        unit: deg
        default: -3.0
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Timing correction at the hot end of the coolant range; usually negative, and
          normally larger in magnitude than the IAT term because it reflects real
          knock tendency rather than charge density.
      - name: ignition_battery_retard_below_v
        id: 0x080C
        type: f32
        unit: V
        default: 11.0
        min: 6.0
        max: 14.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: Battery voltage below which the retard policy engages.
      - name: ignition_battery_retard_deg
        id: 0x080D
        type: f32
        unit: deg
        default: 6.0
        min: 0.0
        max: 30.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Retard applied at that voltage. Low voltage means the coil is not reaching
          primary current, so the honest response is less timing, not more (test I5).
      - name: ignition_user_trim_max_deg
        id: 0x080E
        type: f32
        unit: deg
        default: 5.0
        min: 0.0
        max: 15.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Bound on the per-cell user trim, so a trim cannot be used to smuggle advance
          past the safety envelope by another route.
      - name: ignition_strategy
        id: 0x080F
        type: enum
        default: 0
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Which correction sources are allowed to modify the base map. static_table is
          what a dyno session wants: it is reproducible, because nothing is adapting
          under the measurement.
        values:
          - {name: static_table, value: 0, description: Base map plus configured corrections only}
          - {name: knock_closed_loop, value: 1, description: Adds the dynamic knock controller}
          - {name: adaptive_4d, value: 2, description: Adds the 4D learner per-cell correction}
      - name: spark_duration_min_us
        id: 0x0810
        type: u16
        unit: us
        default: 200
        min: 0
        max: 5000
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Shortest spark-duration feedback pulse treated as a real spark event. This is
          what turns "we commanded a spark" into "a spark was observed"; a mismatch
          raises a DTC instead of being invisible.
      - name: spark_duration_max_us
        id: 0x0811
        type: u32
        unit: us
        default: 100000
        min: 1000
        max: 5000000
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Upper bound of a plausible spark event; beyond it the feedback is noise.

  - name: lambda
    base_id: 0x0900
    items:
      - name: narrowband_switch_threshold_v
        id: 0x0900
        type: f32
        unit: V
        default: 0.45
        min: 0.05
        max: 0.95
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Switching voltage of a narrowband sensor. The ECU uses it for a switching
          period and a duty-based average only; a narrowband sensor is *never* treated
          as a wide-range AFR readout. Register UNK-GT-010.
      - name: narrowband_dwell_time_ms
        id: 0x0901
        type: u16
        unit: ms
        default: 100
        min: 1
        max: 5000
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Minimum time at each state before the sensor is considered to have switched.
          Without it a noisy edge produces a nonsense average lambda.
      - name: wideband_controller_type
        id: 0x0902
        type: enum
        default: 0
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          How lambda is obtained. The native path requires the CJ125 to be physically
          present (CAP_WIDEBAND); without it no wideband feature is offered at all
          rather than being simulated (IOM-001 sec.6).
        values:
          - {name: none, value: 0, description: Open loop only, no lambda available}
          - {name: narrowband, value: 1, description: Switching sensor, limited authority}
          - {name: external_analog, value: 2, description: Controller linearises, analogue out}
          - {name: external_can_serial, value: 3, description: Controller with its own diagnostics}
          - {name: native_cj125, value: 4, description: Direct digital sensor plus heater control}
      - name: wideband_heater_enabled
        id: 0x0903
        type: bool
        default: 0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Wideband heater. Off by default: it is a large continuous load on a
          motorcycle charging system, and it must be actively asked for.
      - name: wideband_heater_duty_pct
        id: 0x0904
        type: f32
        unit: "%"
        default: 50.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Heater duty. High enough to reach the sensor's operating temperature, low
          enough not to cook it; a hot LSU destroys itself, so this is a bounded
          value and not a "full on".
      - name: wideband_warmup_timeout_ms
        id: 0x0905
        type: u32
        unit: ms
        default: 30000
        min: 100
        max: 3000000
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Time allowed for the sensor to be considered ready. Before it expires, closed
          loop is not entered at all - an unheated LSU reports confidently and wrongly.
      - name: lambda_target_bias_min
        id: 0x0906
        type: f32
        unit: lambda
        default: -0.05
        min: -0.5
        max: 0.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Most negative bias the long-term learner may apply to the target. A learner
          that can walk the mixture arbitrarily is a self-inflicted lean, so the bias is
          bounded per cell, per cylinder and globally.
      - name: lambda_target_bias_max
        id: 0x0907
        type: f32
        unit: lambda
        default: 0.10
        min: 0.0
        max: 0.5
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Most positive bias, richer than the table value. A0 asymmetric on purpose:
          drifting rich is recoverable in traffic, drifting lean is not.
      - name: lambda_closed_loop_gain
        id: 0x0908
        type: f32
        default: 0.5
        min: 0.0
        max: 5.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Proportional correction per unit lambda error. The loop bandwidth is
          deliberately limited: the time constant must be much longer than the sensor
          response and much shorter than the transient time constant. A controller is
          never shipped with an unmeasured gain (UNK-FW-010).
      - name: lambda_closed_loop_timeout_ms
        id: 0x0909
        type: u16
        unit: ms
        default: 200
        min: 10
        max: 10000
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          A controller that reports "sensor not ready" is invalid and the loop is not
          entered; a controller that stops reporting entirely times out here into a
          declared fallback rather than a held value.
      - name: lambda_cyl0_trim_pct
        id: 0x090A
        type: f32
        unit: "%"
        default: 0.0
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Per-cylinder fuelling trim. Only meaningful where a per-cylinder channel
          physically exists; the validator refuses this feature beyond
          hardware_lambda_channel_count, so a single common-exhaust sensor can never
          be made to look like four.
      - name: lambda_cyl1_trim_pct
        id: 0x090B
        type: f32
        unit: "%"
        default: 0.0
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl2_trim_pct
        id: 0x090C
        type: f32
        unit: "%"
        default: 0.0
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl3_trim_pct
        id: 0x090D
        type: f32
        unit: "%"
        default: 0.0
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl0_trim_min
        id: 0x090E
        type: f32
        unit: "%"
        default: -20.0
        min: -50.0
        max: 0.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: Hard lower bound on cylinder 0 trim, applied after every correction.
      - name: lambda_cyl0_trim_max
        id: 0x090F
        type: f32
        unit: "%"
        default: 20.0
        min: 0.0
        max: 50.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl1_trim_min
        id: 0x0910
        type: f32
        unit: "%"
        default: -20.0
        min: -50.0
        max: 0.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl1_trim_max
        id: 0x0911
        type: f32
        unit: "%"
        default: 20.0
        min: 0.0
        max: 50.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl2_trim_min
        id: 0x0912
        type: f32
        unit: "%"
        default: -20.0
        min: -50.0
        max: 0.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl2_trim_max
        id: 0x0913
        type: f32
        unit: "%"
        default: 20.0
        min: 0.0
        max: 50.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl3_trim_min
        id: 0x0914
        type: f32
        unit: "%"
        default: -20.0
        min: -50.0
        max: 0.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: lambda_cyl3_trim_max
        id: 0x0915
        type: f32
        unit: "%"
        default: 20.0
        min: 0.0
        max: 50.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED

  - name: knock
    base_id: 0x0A00
    items:
      # knock_signal -> band-pass 5..20 kHz -> envelope -> peak hold
      #            -> per-cylinder association from the firing angle -> retard request
      # No knock claim without hardware: with no sensor, CAP_KNOCK is off and the
      # whole feature is refused at validation rather than silently doing nothing.
      - name: knock_enabled
        id: 0x0A00
        type: bool
        default: 0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Off by default because no knock sensor is known to be fitted on this engine.
          Knock detection is impossible without one, and the ECU must not pretend
          otherwise. Register UNK-FW-008.
      - name: knock_cyl0_window_center_deg
        id: 0x0A01
        type: f32
        unit: deg
        default: 10.0
        min: -20.0
        max: 90.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Crank angle after this cylinder's TDC at which its knock window is centred.
          The window is placed from the firing angle, not guessed, so a change of
          firing order moves it with it.
      - name: knock_cyl1_window_center_deg
        id: 0x0A02
        type: f32
        unit: deg
        default: 10.0
        min: -20.0
        max: 90.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: knock_cyl2_window_center_deg
        id: 0x0A03
        type: f32
        unit: deg
        default: 10.0
        min: -20.0
        max: 90.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: knock_cyl3_window_center_deg
        id: 0x0A04
        type: f32
        unit: deg
        default: 10.0
        min: -20.0
        max: 90.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: knock_cyl0_window_size_deg
        id: 0x0A05
        type: f32
        unit: deg
        default: 30.0
        min: 5.0
        max: 180.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Half-width is *not* implied: a wide window catches more knock and more
          noise, a narrow one misses a slow burn. The size is a calibration because
          the block's resonant frequency is (UNK-FW-008).
      - name: knock_cyl1_window_size_deg
        id: 0x0A06
        type: f32
        unit: deg
        default: 30.0
        min: 5.0
        max: 180.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: knock_cyl2_window_size_deg
        id: 0x0A07
        type: f32
        unit: deg
        default: 30.0
        min: 5.0
        max: 180.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: knock_cyl3_window_size_deg
        id: 0x0A08
        type: f32
        unit: deg
        default: 30.0
        min: 5.0
        max: 180.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: knock_filter_low_hz
        id: 0x0A09
        type: f32
        unit: Hz
        default: 5000.0
        min: 100.0
        max: 20000.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: SOURCE-DERIVED
        source_ref: "IGN-001 sec.5 (band-pass 5-20 kHz)"
        description: Lower corner of the conditioning band-pass.
      - name: knock_filter_high_hz
        id: 0x0A0A
        type: f32
        unit: Hz
        default: 20000.0
        min: 1000.0
        max: 40000.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: SOURCE-DERIVED
        source_ref: "IGN-001 sec.5 (band-pass 5-20 kHz)"
        description: >-
          Upper corner. The band is narrow on purpose: widening it admits combustion
          noise and mechanical ring, which then looks like knock everywhere.
      - name: knock_threshold
        id: 0x0A0B
        type: f32
        default: 0.5
        min: 0.01
        max: 100.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Envelope level counted as a knock event. It is referenced to the measured
          noise floor below, not to an absolute voltage, so a different mounting
          position does not invalidate it.
      - name: knock_noise_floor
        id: 0x0A0C
        type: f32
        default: 0.1
        min: 0.001
        max: 10.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Estimated noise floor of the conditioned signal. Without it a disconnected
          sensor masquerades as "no knock" - or as constant knock, depending on the
          noise. Both failure modes are damaging.
      - name: knock_retard_per_event_deg
        id: 0x0A0D
        type: f32
        unit: deg
        default: 2.0
        min: 0.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: Retard requested per detected event, accumulated per cylinder.
      - name: knock_max_total_retard_deg
        id: 0x0A0E
        type: f32
        unit: deg
        default: 12.0
        min: 0.0
        max: 30.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Ceiling on accumulated retard. Beyond it the response escalates to a cut
          rather than continuing to retard into the engine.
      - name: knock_recovery_deg_per_s
        id: 0x0A0F
        type: f32
        unit: "deg/s"
        default: 2.0
        min: 0.0
        max: 30.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Rate at which retard is released. Recovery is deliberately slow: snapping
          back to full advance the moment the signal quietens is how engines get hurt,
          because the knock that mattered is still ringing.
      - name: knock_escalation_2_retard_deg
        id: 0x0A10
        type: f32
        unit: deg
        default: 6.0
        min: 0.0
        max: 30.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Total retard at which persistent knock escalates to an ignition cut, a second
          stage beyond simple retard.
      - name: knock_escalation_3_events
        id: 0x0A11
        type: u16
        default: 10
        min: 1
        max: 1000
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: Events within the window below which escalation escalates again, to shutdown.
      - name: knock_event_window_ms
        id: 0x0A12
        type: u16
        unit: ms
        default: 500
        min: 10
        max: 60000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Window over which knock events are counted for the escalation decision. A
          count without a window is meaningless - it would escalate on any total.

  - name: idle
    base_id: 0x0B00
    items:
      - name: idle_strategy
        id: 0x0B00
        type: enum
        default: 0
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          How idle is controlled. Most parallel twins have no idle actuator at all and
          idle is ignition plus a bypass, so none is the honest default. Register
          UNK-GT-011.
        # The values here MUST match rc_idle_strategy_t in firmware/include/rc/idle.h
        # one for one.  They are the same numbers on the wire and in the flash image, so a
        # drift between this list and that enum silently selects the wrong actuator - a
        # tuner asking for a PWM valve would get a stepper, which is not a tuning mistake
        # but a different machine.  tests/unit/test_idle.c asserts the two agree.
        values:
          - {name: 'off', value: 0, description: No actuator commanded - idle is left entirely alone}
          - {name: pwm_iac, value: 1, description: PWM air control valve}
          - {name: stepper, value: 2, description: Stepper IAC, H-bridge, bounded energised time}
          - {name: dbw, value: 3, description: Drive-by-wire idle, the throttle is the actuator}
          - {name: ignition, value: 4, description: Spark-based idle control, no air}
      - name: idle_pwm_frequency_hz
        id: 0x0B01
        type: u16
        unit: Hz
        default: 1000
        min: 20
        max: 50000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          PWM carrier for the idle valve. Above the audible band a valve that chatters
          is a symptom of too low a frequency or too little current.
      - name: idle_stepper_steps
        id: 0x0B02
        type: u16
        unit: steps
        default: 100
        min: 10
        max: 1000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Full-travel step count. A stepper commanded past its end stops silently and
          the calibration has no idea, so travel is a stated number.
      - name: idle_stepper_microsteps
        id: 0x0B03
        type: u8
        default: 16
        min: 1
        max: 32
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: idle_stepper_max_energised_ms
        id: 0x0B04
        type: u16
        unit: ms
        default: 10000
        min: 100
        max: 60000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Maximum energised time before the stepper is de-energised and returned toward
          zero. A stepper that is commanded forever is a thermal event, not a
          convenience (ACT-001 sec.4, test A12).
      - name: idle_valve_duty_min_pct
        id: 0x0B05
        type: f32
        unit: "%"
        default: 0.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: idle_valve_duty_max_pct
        id: 0x0B06
        type: f32
        unit: "%"
        default: 60.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Bound on idle air. A stuck-open idle valve floods the engine and floods the
          exhaust, so the ceiling is a calibration value with a reason, not a guess.
      - name: idle_dashpot_gain
        id: 0x0B07
        type: f32
        default: 0.05
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Proportional gain of the air dashpot on rpm error. Terminology carried over
          from a carburettor because the physics is the same; it is a PID term, not a
          legacy artefact.
      - name: idle_antistall_rpm_drop
        id: 0x0B08
        type: u16
        unit: rpm
        default: 300
        min: 0
        max: 2000
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          How far below the target the idle controller may let rpm fall before the
          anti-stall assist engages. This is the last defence against a stall in
          traffic, and it engages on rpm, never on a timer.
      - name: idle_antistall_torque_scale
        id: 0x0B09
        type: f32
        default: 0.3
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Fraction of full authority available to the anti-stall assist. Bounded below
          one on purpose: a stall assist that can command full torque on a stationary
          engine is a rev limiter wearing a different name.
      - name: idle_antistall_hold_ms
        id: 0x0B0A
        type: u16
        unit: ms
        default: 5000
        min: 0
        max: 60000
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Maximum time the assist may stay engaged. Every latching request has a
          maximum lifetime; a latch with no release path is a prohibited defect.
      - name: idle_entry_rpm
        id: 0x0B0B
        type: u16
        unit: rpm
        default: 1400
        min: 400
        max: 4000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: idle_exit_rpm
        id: 0x0B0C
        type: u16
        unit: rpm
        default: 1800
        min: 400
        max: 5000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Hysteresis on idle entry/exit, so a rider feathering the throttle does not
          make the idle controller and the rider fight each other.
      - name: idle_open_loop_gain
        id: 0x0B0D
        type: f32
        default: 0.2
        min: 0.0
        max: 5.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Feed-forward term - a lookup of position against coolant temperature.
      - name: idle_closed_loop_gain
        id: 0x0B0E
        type: f32
        default: 0.1
        min: 0.0
        max: 5.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Integral authority on rpm error, per second. Kept low deliberately: an
          integral term large enough to react quickly is also large enough to hunt.
      - name: idle_enable_at_ect_c
        id: 0x0B0F
        type: f32
        unit: "degC"
        default: 40.0
        min: -50.0
        max: 150.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Coolant temperature above which idle control takes over. Below it, cold start
          enrichment owns the mixture and an idle controller would fight it.
        dependencies: [idle_rpm_target]

  - name: boost
    base_id: 0x0C00
    items:
      - name: boost_target_table
        id: 0x0C00
        type: table2d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_rows: 8
        alloc_cols: 8
        cell_type: f32
        cell_min: 0.0
        cell_max: 200.0
        row_axis: rpm
        col_axis: load_pct
        description: >-
          Target manifold pressure in kPa absolute against rpm and load. Boost is a
          requesting subsystem, not an override: overboost protection outranks it in
          the torque manager (TQM-001 rank 10).

      - name: boost_target_table_rpm_axis
        id: 0x0C0D
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 1000
        cell_max: 12000
        axis_first: 1000
        unit: rpm
        description: >-
          rpm breakpoints for boost_target_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.

      - name: boost_target_table_load_pct_axis
        id: 0x0C0E
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 0
        cell_max: 100
        axis_first: 0
        unit: pct
        description: >-
          load_pct breakpoints for boost_target_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.
      - name: boost_closed_loop_enabled
        id: 0x0C01
        type: bool
        default: 0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Off by default. A naturally aspirated engine must not have a boost controller
          quietly commanding a solenoid, and closed loop with unmeasured gains is exactly
          the oscillation risk UNK-FW-010 is about.
      - name: boost_p_gain
        id: 0x0C02
        type: f32
        default: 0.01
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Proportional gain, duty fraction per kPa of error. The stability margin must
          be measured in SIL/HIL before this loop is ever enabled.
      - name: boost_i_gain
        id: 0x0C03
        type: f32
        default: 0.002
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: boost_d_gain
        id: 0x0C04
        type: f32
        default: 0.0
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Derivative term, left at zero: the measured signal is already noisy and the
          derivative amplifies exactly the part that is not information.
      - name: boost_integral_limit_pct
        id: 0x0C05
        type: f32
        unit: "%"
        default: 30.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Anti-windup clamp on the integral term. A wound-up boost controller is a
          boost controller that overshoots the moment the limit releases.
      - name: boost_wastegate_min_duty_pct
        id: 0x0C06
        type: f32
        unit: "%"
        default: 0.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Duty the controller may reduce to. A floor above zero models a wastegate
          that cannot fully close - a real and frequently overlooked mechanical fact.
      - name: boost_wastegate_max_duty_pct
        id: 0x0C07
        type: f32
        unit: "%"
        default: 90.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Duty the controller may command. Left below 100 % so a failed
          solenoid does not become a stuck-open gate.
      - name: boost_open_loop_gain
        id: 0x0C08
        type: f32
        default: 1.0
        min: 0.0
        max: 10.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Feed-forward from the target table before any feedback, so a step demand does
          not rely on the loop to find the level from scratch.
      - name: boost_overboost_limit_kpa
        id: 0x0C09
        type: f32
        unit: kPa
        default: 220.0
        min: 0.0
        max: 1000.0
        owner: TUNER
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Boost-controller protection threshold: the emergency trip the boost subsystem
          takes, which must sit ABOVE the design maximum so a healthy closed loop never
          reaches it. safety.boost_max_kpa is the non-bypassable envelope below it.
        dependencies: [boost_max_kpa]
      - name: boost_closed_loop_rpm_min
        id: 0x0C0A
        type: u16
        unit: rpm
        default: 2000
        min: 0
        max: 20000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Below this rpm the loop is open: at low speed a small pressure error is a
          large mass error and the feedback is not informative.
      - name: boost_closed_loop_rpm_max
        id: 0x0C0B
        type: u16
        unit: rpm
        default: 8000
        min: 0
        max: 20000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Upper end of the closed-loop band, where the valve starts to lag.
      - name: boost_solenoid_pwm_hz
        id: 0x0C0C
        type: u16
        unit: Hz
        default: 1000
        min: 20
        max: 50000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Solenoid PWM carrier. Bounded duty, and the output is off on overboost, sync
          loss or a closed-loop fault (ACT-001 sec.6).

  - name: vvt
    base_id: 0x0D00
    items:
      - name: vvt_enabled
        id: 0x0D00
        type: bool
        default: 0
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Off by default. The GT650 is an overhead-cam engine with no phaser, and
          enabling VVT on hardware that does not have it would be exactly the
          fabricated capability the product is required not to claim (IOM-001 sec.6).
      - name: vvt_target_table
        id: 0x0D01
        type: table2d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_rows: 8
        alloc_cols: 8
        cell_type: f32
        cell_min: -35.0
        cell_max: 35.0
        row_axis: rpm
        col_axis: load_pct
        description: >-
          Target phaser angle in crank degrees against rpm and load. Positive is
          advanced; the actual authority is limited by the actuator and verified by
          position feedback, never by this table alone.

      - name: vvt_target_table_rpm_axis
        id: 0x0D0B
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 1000
        cell_max: 12000
        axis_first: 1000
        unit: rpm
        description: >-
          rpm breakpoints for vvt_target_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.

      - name: vvt_target_table_load_pct_axis
        id: 0x0D0C
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 0
        cell_max: 100
        axis_first: 0
        unit: pct
        description: >-
          load_pct breakpoints for vvt_target_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.
      - name: vvt_min_duty_pct
        id: 0x0D02
        type: f32
        unit: "%"
        default: 20.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Duty the controller may reduce to. A floor above zero keeps oil pressure to
          the phaser above the unlock threshold at high rpm.
      - name: vvt_max_duty_pct
        id: 0x0D03
        type: f32
        unit: "%"
        default: 80.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Duty ceiling, held below 100 % so a failed solenoid is not a fully open phaser.
      - name: vvt_p_gain
        id: 0x0D04
        type: f32
        default: 0.5
        min: 0.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: Proportional gain, duty fraction per degree of position error.
      - name: vvt_i_gain
        id: 0x0D05
        type: f32
        default: 0.1
        min: 0.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
      - name: vvt_d_gain
        id: 0x0D06
        type: f32
        default: 0.0
        min: 0.0
        max: 20.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: vvt_integral_limit_pct
        id: 0x0D07
        type: f32
        unit: "%"
        default: 20.0
        min: 0.0
        max: 100.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Anti-windup clamp, for the same reason as boost - a wound-up controller is a
          stored overshoot waiting for the moment the limit releases.
      - name: vvt_position_tolerance_deg
        id: 0x0D08
        type: f32
        unit: deg
        default: 2.0
        min: 0.1
        max: 15.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Position error beyond which closed loop stops integrating and raises a DTC.
          The point is to catch a phaser that is not following its command before the
          timing is silently wrong.
      - name: vvt_feedback_enabled
        id: 0x0D09
        type: bool
        default: 0
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Whether a position sensor exists. Off means the controller is open loop and
          the ECU must say so in the capability frame rather than implying verification.
      - name: vvt_pwm_hz
        id: 0x0D0A
        type: u16
        unit: Hz
        default: 500
        min: 20
        max: 50000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED

  - name: flexfuel
    base_id: 0x1600
    items:
      # Stoich AFR and density blending already live in the engine group
      # (fuel_stoich_afr_*, fuel_density_*). What is here is the part that a flex-fuel
      # *sensor* additionally changes: cold start and ignition blend. See FUEL-001 sec.11.
      - name: flexfuel_enabled
        id: 0x1600
        type: bool
        default: 0
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Off by default: a motorcycle with no flex sensor has a fixed blend, set once
          in the engine group. Enabling this without a sensor would make the ECU blend
          from noise.
      - name: flexfuel_sensor_type
        id: 0x1601
        type: enum
        default: 0
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          How the ethanol fraction is obtained. A CAN source must have an explicit
          timeout and a defined fallback, or a dead adapter would freeze the blend.
        values:
          - {name: none, value: 0, description: Fixed blend set by hand in the engine group}
          - {name: analog, value: 1, description: 0..5 V linear sensor}
          - {name: frequency, value: 2, description: 50..500 Hz, the common form}
          - {name: can, value: 3, description: Reported by another ECU or adapter}
      - name: flexfuel_cold_start_enrich_pct
        id: 0x1602
        type: f32
        unit: "%"
        default: 20.0
        min: 0.0
        max: 200.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Cold-start enrichment at full ethanol. Ethanol needs more mixture to reach
          the same lambda target, and on top of that its higher charge temperature
          changes how that mixture burns cold.
      - name: flexfuel_cold_start_below_ect_c
        id: 0x1603
        type: f32
        unit: "degC"
        default: 20.0
        min: -50.0
        max: 150.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: flexfuel_ignition_blend_deg
        id: 0x1604
        type: f32
        unit: deg
        default: 3.0
        min: -15.0
        max: 15.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Timing change at full ethanol. Ethanol's higher charge temperature and
          latent heat mean *more* advance is usually needed, not less - the opposite of
          the instinct imported from gasoline, and the reason this is a calibration with
          a sign rather than a fixed rule.
      - name: flexfuel_ignition_blend_max_deg
        id: 0x1605
        type: f32
        unit: deg
        default: 8.0
        min: -20.0
        max: 20.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Ceiling on the ignition blend term, so a misreading blend cannot move timing
          without limit.
      - name: flexfuel_min_ethanol_fraction
        id: 0x1606
        type: f32
        unit: frac
        default: 0.0
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Lowest fraction accepted from the sensor. Below this the reading is treated
          as a fault rather than blended, because a 0 % floor is where a disconnected
          sensor would otherwise land.
      - name: flexfuel_max_ethanol_fraction
        id: 0x1607
        type: f32
        unit: frac
        default: 0.85
        min: 0.0
        max: 1.0
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Highest fraction accepted. Deliberately below 1.0 by default: a genuine E100
          fill is rare enough on a motorcycle that being told about it is more useful
          than silently running a blend the calibration was never set up for.
      - name: flexfuel_switch_hysteresis_frac
        id: 0x1608
        type: f32
        unit: frac
        default: 0.02
        min: 0.0
        max: 0.2
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Hysteresis on switching the *active* blend between two adjacent calibrated
          points, so a signal hovering at a boundary does not dither the whole model.
      - name: flexfuel_invalid_action
        id: 0x1609
        type: enum
        default: 1
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          What happens when the blend sensor fails. Reverting to the fixed blend in the
          engine group is the default, because a *wrong* blend is a persistent
          fuelling error while a *stale* one is at least visible.
        values:
          - {name: hold_last, value: 0, description: Keep the last blend - a bad day is still a bad day}
          - {name: revert_to_gasoline, value: 1, description: Fall back to the fixed engine-group blend}
          - {name: disable_closed_loop, value: 2, description: Go open loop, hold the blend}
          - {name: enter_limp, value: 3, description: Declared reduced-authority state}

  - name: gear
    base_id: 0x1700
    items:
      - name: gear_ratio_1
        id: 0x1700
        type: f32
        unit: ":1"
        default: 2.2
        min: 0.5
        max: 6.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Transmission ratios. These are facts about the gearbox, not tuning choices, so
          they are only as good as the service manual - and the GT650 gearbox ratio is
          not published. A wrong ratio does not hurt the engine; it makes gear-derived
          speed, shift scheduling, launch and the pit limiter all quietly wrong.
        live_edit: false
      - name: gear_ratio_2
        id: 0x1701
        type: f32
        unit: ":1"
        default: 1.6
        min: 0.5
        max: 6.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        live_edit: false
      - name: gear_ratio_3
        id: 0x1702
        type: f32
        unit: ":1"
        default: 1.25
        min: 0.5
        max: 6.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        live_edit: false
      - name: gear_ratio_4
        id: 0x1703
        type: f32
        unit: ":1"
        default: 1.0
        min: 0.5
        max: 6.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        live_edit: false
      - name: gear_ratio_5
        id: 0x1704
        type: f32
        unit: ":1"
        default: 0.85
        min: 0.5
        max: 6.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        live_edit: false
      - name: gear_ratio_6
        id: 0x1705
        type: f32
        unit: ":1"
        default: 0.72
        min: 0.5
        max: 6.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        live_edit: false
      - name: final_drive_ratio
        id: 0x1706
        type: f32
        unit: ":1"
        default: 3.5
        min: 0.5
        max: 10.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        live_edit: false
      - name: primary_ratio
        id: 0x1707
        type: f32
        unit: ":1"
        default: 1.0
        min: 0.5
        max: 4.0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Primary reduction, between crank and gearbox input. live_edit false.
        live_edit: false
      - name: gear_ratio_count
        id: 0x1708
        type: u8
        default: 6
        min: 1
        max: 6
        owner: READ_ONLY
        safety_class: HIGH
        default_source: UNVERIFIED
        derived: true
        description: >-
          Number of forward ratios this configuration declares. The remaining
          gear_ratio_* items stay in the image but are not used, which keeps ids stable
          if a different gearbox is configured. live_edit false.
        live_edit: false
      - name: tyre_circumference_m
        id: 0x1709
        type: f32
        unit: m
        default: 1.9
        min: 0.5
        max: 3.5
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Rolling circumference of the driven tyre. Together with the ratios this is what
          turns engine rpm into road speed, and it is the second half of the kinematic
          consistency check against the wheel-speed sensor (SENS-001 sec.8).
      - name: reverse_detection_enabled
        id: 0x170A
        type: bool
        default: 0
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Most motorcycles have no reverse. It stays off until a gear sensor or a
          kinematic derivation exists, and neither is known for this bike. Register
          UNK-GT-015.
      - name: reverse_speed_threshold_kph
        id: 0x170B
        type: f32
        unit: "km/h"
        default: 5.0
        min: 0.0
        max: 30.0
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Below this road speed, rpm and wheel speed disagreeing in the reverse
          direction is treated as reverse. Small because a false positive at speed
          means an unintended launch-direction command.
      - name: gear_strategy_table
        id: 0x170C
        type: table2d
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        alloc_rows: 8
        alloc_cols: 8
        cell_type: f32
        cell_min: 0.0
        cell_max: 150.0
        default_fill: 100.0
        row_axis: gear
        col_axis: rpm
        description: >-
          Per-gear torque scale, percent, against gear and rpm. This is a *request*, not
          a command: it enters the torque manager as a requester and loses to anything
          protective, exactly like every other feature.


      - name: gear_strategy_table_gear_axis
        id: 0x170D
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 1
        cell_max: 8
        axis_first: 1
        unit: gear
        description: >-
          gear breakpoints for gear_strategy_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.

      - name: gear_strategy_table_rpm_axis
        id: 0x170E
        type: axis1d
        owner: TUNER
        safety_class: HIGH
        default_source: UNVERIFIED
        alloc_count: 8
        cell_type: u16
        cell_min: 1000
        cell_max: 12000
        axis_first: 1000
        unit: rpm
        description: >-
          rpm breakpoints for gear_strategy_table: 8 of them, strictly increasing.
          These are the coordinates the table is interpolated along, and they live
          in the calibration rather than in the firmware so a tuner can put the
          resolution where the engine actually spends its time - at idle, usually,
          rather than spread evenly across a range it never visits.
