# RACCOON V2 - hard safety limits, communication trust policy and logging.
# Single source of truth for the firmware image and the tuner. See docs/CALIBRATION_SPEC.md.
schema_version: 1

groups:
  - name: safety
    base_id: 0x1500
    items:
      # The hard safety envelope (SC-001 sec.5). These items are applied to the FINAL
      # command, after the torque manager, and are not an input to any feature, so a
      # mode, a launch or a tuner cannot weaken them. They live in the base image
      # precisely so that a mode overlay cannot carry a weaker limit.
      #
      # Ownership rule: engineering mode may only *lower* these, never raise one above
      # a compiled ceiling, and every change requires an authenticated session and an
      # audit entry (SEC-001 sec.6, test SEC-3).
      - name: rpm_limit
        id: 0x1500
        type: u16
        unit: rpm
        default: 8000
        min: 2000
        max: 12000
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Hard rev limit. Above it there is no spark and no fuel. This is the *ECU*
          limit; the trigger subsystem's overspeed_period_us is a separate, faster and
          hardware-backed path for the case where the CPU is not keeping up (H-09).
        live_edit: false
        dependencies: [max_rpm]
      - name: rpm_hysteresis
        id: 0x1501
        type: u16
        unit: rpm
        default: 300
        min: 0
        max: 3000
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Speed the limit releases at. Without hysteresis the limiter chatters on and
          off at the limit, and every cycle of that chatter is a fuelling transient.
        live_edit: false
      - name: overspeed_rpm
        id: 0x1502
        type: u16
        unit: rpm
        default: 10500
        min: 2000
        max: 20000
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Instantaneous overspeed, above which a fault is declared and outputs are
          inhibited without waiting for the limit. The gap between this and rpm_limit
          is the overshoot the limiter is allowed; it must exceed the measured
          scheduling error, which is not yet known (UNK-FW-002/003).
        live_edit: false
      - name: lean_lambda_limit
        id: 0x1503
        type: f32
        unit: lambda
        default: 1.20
        min: 1.0
        max: 2.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Leanest lambda the engine may be commanded to run at. This cuts and limits; it
          does not merely warn. The commanded target and the long-term learner bias are
          both clamped by it, so a bad day cannot walk the mixture lean (test F17).
        live_edit: false
      - name: rich_lambda_limit
        id: 0x1504
        type: f32
        unit: lambda
        default: 0.550
        min: 0.3
        max: 1.2
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Richest lambda permitted. A rich limit matters because over-fuelling is what
          destroys catalytic converters and what leaves a hot pipe that backfires on
          shutdown (H-05).
        live_edit: false
      - name: ect_max_c
        id: 0x1505
        type: f32
        unit: "degC"
        default: 120.0
        min: 60.0
        max: 200.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Coolant over-temperature limit. The action escalates retard, then limits,
          then cuts; the escalation ladder is a safety group decision, not a feature
          one, because a mode must not be able to soften it (H-07, TM12).
        live_edit: false
      - name: iat_max_c
        id: 0x1506
        type: f32
        unit: "degC"
        default: 130.0
        min: 40.0
        max: 250.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Charge-air temperature limit. Bound high because this is a *charge* sensor and
          genuinely hot air is survivable; it exists to catch a failed IAT that reports
          ambient forever and so disables every heat-based protection.
        live_edit: false
      - name: oil_pressure_min_bar
        id: 0x1507
        type: f32
        unit: bar
        default: 1.0
        min: 0.0
        max: 10.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Minimum oil pressure. A latching cut with recovery hysteresis, not a warning:
          a motorcycle that has lost oil pressure is a few seconds from a seized
          engine and a rider who does not know (H-08). Register UNK-GT-018.
        live_edit: false
      - name: oil_pressure_recovery_bar
        id: 0x1508
        type: f32
        unit: bar
        default: 1.5
        min: 0.0
        max: 12.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Pressure at which a latched oil cut is released. Above oil_pressure_min_bar by
          design: releasing at the trip point makes the ECU hunt across its own limit
          and the rider ride an engine that keeps cutting.
        live_edit: false
      - name: oil_temp_max_c
        id: 0x1509
        type: f32
        unit: "degC"
        default: 130.0
        min: 60.0
        max: 200.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: Oil over-temperature limit; derates before coolant does on most engines.
        live_edit: false
      - name: egt_max_c
        id: 0x150A
        type: f32
        unit: "degC"
        default: 900.0
        min: 200.0
        max: 1500.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Exhaust temperature limit. The single most consequential *unmeasured* number
          in this file: it is engine-, cylinder- and probe-specific, and it is the limit
          that stands between a lean condition and a melted exhaust valve. Register
          UNK-GT-006 for the coil and EGT probe placement is equally unknown.
        live_edit: false
      - name: battery_min_v
        id: 0x150B
        type: f32
        unit: V
        default: 9.5
        min: 4.0
        max: 14.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Under-voltage limit. Below it the coils cannot reach primary current, so the
          honest response is to retard and derate rather than to keep commanding spark
          the hardware cannot deliver.
        live_edit: false
      - name: battery_max_v
        id: 0x150C
        type: f32
        unit: V
        default: 16.0
        min: 10.0
        max: 40.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Over-voltage limit, from a failed regulator or a jump-start with the wrong
          battery. The ECU should refuse to run rather than let 18 V reach the
          analogue front end.
        live_edit: false
      - name: fuel_pressure_min_bar
        id: 0x150D
        type: f32
        unit: bar
        default: 2.0
        min: 0.0
        max: 10.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Minimum rail pressure. A pressure drop is compensated *and* limited: the
          compensation corrects the metering, the limit stops an engine that is being
          fed by a dying pump. Register UNK-GT-005.
        live_edit: false
      - name: injector_duty_max_pct
        id: 0x150E
        type: f32
        unit: "%"
        default: 80.0
        min: 5.0
        max: 100.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          ECU-side injector duty ceiling, independent of the hardware ceiling in
          hardware.injector_max_duty_pct. Two limits in two places is not redundancy for
          its own sake: the hardware one survives a wedged CPU, this one can be lowered
          by engineering mode per engine.
        live_edit: false
      - name: dwell_max
        id: 0x150F
        type: f32
        unit: ms
        default: 8.0
        min: 1.0
        max: 20.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Safety ceiling on commanded dwell. The hardware max-dwell timer is the
          independent enforcement that survives a hung CPU (H-03, test I3); this value
          must stay at or below it, and the validator refuses a configuration where it
          does not.
        live_edit: false
      - name: boost_max_kpa
        id: 0x1510
        type: f32
        unit: kPa
        default: 200.0
        min: 0.0
        max: 1000.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Non-bypassable overboost limit. A boost target above it is refused at
          validation time rather than clamped at runtime, so the mistake is visible in
          the tuner instead of hidden (H-19).
        live_edit: false
      - name: sync_loss_action
        id: 0x1511
        type: enum
        default: 4
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          What loss of crank synchronisation does. The default is a request to cut,
          because without phase the ECU cannot know which cylinder is on its exhaust
          stroke, and a fuelling or spark event at the wrong phase is exactly H-01.
          Values are ordered from "carry on and log" to "latched shutdown".
        values:
          - {name: warn_only, value: 0, description: Log and continue - only for bench work}
          - {name: retard_to_safe, value: 1, description: Fall back to conservative timing}
          - {name: limit_torque, value: 2, description: Reduced authority, engine keeps running}
          - {name: fuel_cut_only, value: 3, description: No fuel, keep spark for a clean coast}
          - {name: request_cut, value: 4, description: Full cut, resynchronise, recover on re-sync}
          - {name: shutdown_request, value: 5, description: Latched - manual re-arm required}
        live_edit: false
      - name: action_level
        id: 0x1512
        type: enum
        default: 1
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          The escalation ladder used when a limit is exceeded. The default is RETARD
          because a mild over-temperature or a single knock event should not stop a
          motorcycle mid-corner; the ladder exists so that persistence escalates
          automatically rather than relying on the rider noticing.
        values:
          - {name: warning, value: 0, description: Log and illuminate, no change to the command}
          - {name: retard, value: 1, description: Remove spark, recoverable, the default first step}
          - {name: enrich, value: 2, description: Richer mixture - only where leanness caused the fault}
          - {name: limit, value: 3, description: Reduce allowed torque scale to the declared floor}
          - {name: cut, value: 4, description: Latched fuel and spark cut with a defined re-enable}
          - {name: shutdown, value: 5, description: Latched shutdown, manual re-arm only}
        live_edit: false
      - name: oil_cut_timeout_ms
        id: 0x1513
        type: u16
        unit: ms
        default: 5000
        min: 100
        max: 60000
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Maximum lifetime of the latching oil cut. Every latch has a bound: a latch
          with no release path is a slow brick in software form (TQM-001 R7).
        live_edit: false
      - name: lean_cut_hold_ms
        id: 0x1514
        type: u16
        unit: ms
        default: 2000
        min: 50
        max: 30000
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          How long a lean excursion must persist before the cut latches. Short enough
          that a transient cannot be ridden through, long enough that a single noisy
          wideband frame does not stop the engine.
        live_edit: false
      - name: sensor_fallback_speed_limit_kph
        id: 0x1515
        type: f32
        unit: "km/h"
        default: 60.0
        min: 0.0
        max: 300.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Road speed above which a load-sensor failure escalates from a limp to a
          reduced-authority state. The philosophy in SC-001 sec.4 is that losing a
          comfort function must not stop a motorcycle mid-corner - but it must also not
          be running full authority on a guess at 100 km/h.
        live_edit: false
      - name: max_fuel_pressure_bar
        id: 0x1516
        type: f32
        unit: bar
        default: 8.0
        min: 0.0
        max: 30.0
        owner: SAFETY
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Upper rail-pressure limit. A stuck regulator would otherwise push the
          injectors past every point of their flow curve and flood the engine.
        live_edit: false

  - name: comms
    base_id: 0x0500
    items:
      # One protocol, three transports. The default posture for a freshly powered ECU
      # with no session is read-only telemetry with every write refused and engine
      # control disarmed (SEC-001 sec.1).
      - name: can_bitrate
        id: 0x0500
        type: enum
        default: 1
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Nominal CAN rate. Persisted per project. 500 kbit/s is the common choice on
          modern motorcycles; the exact controller count on the chosen part is still
          open (UNK-REF-005).
        values:
          - {name: kbit_250, value: 0, description: 250 kbit/s}
          - {name: kbit_500, value: 1, description: 500 kbit/s}
          - {name: kbit_800, value: 2, description: 800 kbit/s}
          - {name: kbit_1000, value: 3, description: 1 Mbit/s}
          - {name: kbit_125, value: 4, description: 125 kbit/s, older harnesses}
      - name: can_db_default_timeout_ms
        id: 0x0501
        type: u16
        unit: ms
        default: 200
        min: 1
        max: 10000
        owner: ENGINEER
        safety_class: HIGH
        default_source: SOURCE-DERIVED
        source_ref: "CAN-001 sec.3 (timeout 200 ms example)"
        description: >-
          Default signal timeout applied to a new CAN database entry. A CAN frame may
          only be an input to the control loop if it has an explicit timeout, a fallback
          value and a validity flag - so the default is generous but finite.
      - name: can_db_default_min_raw
        id: 0x0502
        type: i32
        default: 0
        min: -2147483647
        max: 2147483646
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Default raw validity window of a new signal. Wide by default, because a narrow default silently rejects a legitimate signal from an adapter with a different scaling.
      - name: can_db_default_max_raw
        id: 0x0503
        type: i32
        default: 65535
        min: -2147483646
        max: 2147483647
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: can_db_auto_apply_on_connect
        id: 0x0504
        type: bool
        default: 0
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Off by default: silently replacing a validated database on every connect makes
          it impossible to tell which database the engine is currently running against.
      - name: protocol_version
        id: 0x0505
        type: u16
        default: 1
        min: 1
        max: 65535
        owner: READ_ONLY
        safety_class: HIGH
        default_source: SOURCE-DERIVED
        source_ref: "PROTO-001 sec.1 (VER packed major/minor)"
        derived: true
        description: >-
          Wire protocol version, major packed in the high byte. A minor bump is
          backward compatible; a major bump is negotiated and never guessed
          (PROTO-001 sec.1). Derived from the firmware build.
        live_edit: false
      - name: session_timeout_ms
        id: 0x0506
        type: u32
        unit: ms
        default: 30000
        min: 1000
        max: 600000
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Bounded session lifetime. An expired session cannot write. Losing the session
          does not disturb the running engine, which is the behaviour that makes a
          dropped Wi-Fi link harmless (test PR8).
      - name: session_command_budget
        id: 0x0507
        type: u16
        default: 1000
        min: 1
        max: 65535
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Commands a session may issue before re-authentication. The budget exists so
          that a stolen-but-unfinished session is bounded in time as well as in privilege.
      - name: signed_tune_policy
        id: 0x0508
        type: enum
        default: 1
        owner: ENGINEER
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          How the ECU treats a tune with no valid RACCOON signature. This is a
          three-state trust model, and the middle state is a deliberate product
          decision, not a compromise: the release key signs firmware and *reference*
          configurations, but a third-party tuner who bought the product legitimately
          cannot obtain that key, so forcing every tune through it would make every
          legitimate tune permanently untrusted. Instead an unsigned tune is written
          only to the inactive slot, can never auto-activate, cannot arm until it is
          explicitly acknowledged with a valid session, and is labelled UNTRUSTED in
          every view *and in the log header* so a log can never misrepresent its own
          provenance. There is no public precedent for this, so the design has to stand
          on internal review alone (UNK-REF-006).
        values:
          - {name: raccoon_signed, value: 0, description: Only RACCOON-signed tunes may be written or armed}
          - {name: untrusted_engineering_override, value: 1, description: Unsigned allowed via engineering credential, inactive slot only, audited}
          - {name: forbidden, value: 2, description: Unsigned tunes are rejected outright}
        live_edit: false
      - name: engineering_mode_enabled
        id: 0x0509
        type: bool
        default: 1
        owner: ENGINEER
        safety_class: CRITICAL
        default_source: UNVERIFIED
        description: >-
          Whether engineering mode exists at all in this build. On by default, and
          conspicuously so: a build where it *cannot* be enabled is a build whose
          diagnostics and bench procedures are one mistake away from being
          unrecoverable. It still requires an authenticated ENGINEER credential and
          every action it permits is audited.
      - name: engineering_mode_timeout_ms
        id: 0x050A
        type: u32
        unit: ms
        default: 300000
        min: 1000
        max: 3600000
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Engineering mode expires on its own. It does not persist because someone
          enabled it once on a bench and never went back.
      - name: audit_log_enabled
        id: 0x050B
        type: bool
        default: 1
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Signed audit log of every privileged action - who, what, when, outcome, plus a
          monotonic counter - surviving power cycles and tamper-evident. Required by
          SEC-001 sec.6 and test SEC-11.
      - name: audit_log_entries
        id: 0x050C
        type: u16
        default: 256
        min: 16
        max: 65535
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Retained audit entries. It is a ring: when it wraps, the fact that it wrapped
          is itself recorded, so a full log is never silently mistaken for a quiet one.
      - name: wireless_enabled
        id: 0x050D
        type: bool
        default: 0
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          The ESP32-S3 wireless transport. Off by default, and it should stay a
          workshop and paddock tool: it is a *transport*, not a privilege. If the radio
          is absent the ECU behaves identically, and Wi-Fi association latency is
          unmeasured (UNK-SW-007).
      - name: wifi_tx_power_dbm
        id: 0x050E
        type: f32
        unit: dBm
        default: 19.5
        min: 0.0
        max: 20.0
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: SOURCE-DERIVED
        source_ref: "ESP32-S3 datasheet (2.4 GHz 1T1R, up to +19.5 dBm)"
        description: >-
          Transmit power. It is bounded rather than pinned at maximum: +20 dBm from a
          pocket of metal in a fairing is both a EMC liability and a battery cost
          (355 mA at full power).
      - name: wifi_channel
        id: 0x050F
        type: u8
        default: 6
        min: 1
        max: 13
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Fixed 2.4 GHz channel. Fixed rather than scanned: a tuner that has to find
          the ECU on a congested band at a track is a tuner who cannot download a log
          before the session starts.
      - name: wifi_max_clients
        id: 0x0510
        type: u8
        default: 2
        min: 1
        max: 8
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Simultaneous stations. Small on purpose: every client is a live path to a
          calibration write, and the number is not a performance knob.
      - name: wireless_connect_timeout_ms
        id: 0x0511
        type: u32
        unit: ms
        default: 15000
        min: 1000
        max: 120000
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Association timeout before the transport is declared unavailable. Bounded so
          a dead AP cannot leave the transport layer spinning.
      - name: protocol_max_payload
        id: 0x0512
        type: u16
        unit: bytes
        default: 4096
        min: 8
        max: 65535
        owner: READ_ONLY
        safety_class: MEDIUM
        default_source: UNVERIFIED
        derived: true
        description: >-
          Per-transport payload ceiling: 4096 for USB, 8 for CAN, 64 for CAN-FD. A
          larger payload is fragmented with a bounded fragment count and times out.
          Derived from the transport.
        live_edit: false

  - name: logging
    base_id: 0x0600
    items:
      # Four rate groups plus a total throughput ceiling. One flat rate is wasteful and
      # one slow rate loses the interesting parts (LOG-001 sec.3).
      - name: log_trigger_enabled
        id: 0x0600
        type: bool
        default: 0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Per-tooth trigger log: tooth timestamps, periods, accepted flag, reason for
          rejection. This is the only rate that can show a decoder that is losing sync
          without the engine misfiring.
      - name: log_trigger_rate_hz
        id: 0x0601
        type: u16
        unit: Hz
        default: 20000
        min: 1
        max: 60000
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Nominal ceiling on the trigger group's sample rate. The group is really
          per-tooth, so this is a bound for admission, not a request for a fixed rate.
      - name: log_fast_enabled
        id: 0x0602
        type: bool
        default: 0
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: Combustion-domain signals - knock envelope, spark current, crank angle.
      - name: log_fast_rate_hz
        id: 0x0603
        type: u16
        unit: Hz
        default: 1000
        min: 10
        max: 20000
        owner: TUNER
        safety_class: MEDIUM
        default_source: SOURCE-DERIVED
        source_ref: "LOG-001 sec.3 (FAST 1 kHz)"
      - name: log_core_enabled
        id: 0x0604
        type: bool
        default: 1
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          The main tuning dataset - rpm, tps, map, lambda, injection ms, ignition deg,
          dwell and the whole correction vector. On by default because this is the
          record most logs are actually wanted for.
      - name: log_core_rate_hz
        id: 0x0605
        type: u16
        unit: Hz
        default: 200
        min: 10
        max: 5000
        owner: TUNER
        safety_class: MEDIUM
        default_source: SOURCE-DERIVED
        source_ref: "LOG-001 sec.3 (CORE 200 Hz)"
      - name: log_slow_enabled
        id: 0x0606
        type: bool
        default: 1
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
      - name: log_slow_rate_hz
        id: 0x0607
        type: u16
        unit: Hz
        default: 20
        min: 1
        max: 1000
        owner: TUNER
        safety_class: MEDIUM
        default_source: SOURCE-DERIVED
        source_ref: "LOG-001 sec.3 (SLOW 20 Hz)"
      - name: log_throughput_ceiling_kb_s
        id: 0x0608
        type: u32
        unit: kB/s
        default: 2000
        min: 1
        max: 100000
        owner: ENGINEER
        safety_class: HIGH
        default_source: UNVERIFIED
        description: >-
          Total throughput ceiling across every group. A requested set that exceeds it
          is *refused with an explanation*, never silently degraded (test L7). The
          ceiling is meant to be measured against the real medium, which has not been
          selected yet - Register UNK-HW-009.
      - name: log_ring_buffer_s
        id: 0x0609
        type: u16
        unit: s
        default: 30
        min: 1
        max: 3600
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          RAM ring that absorbs burst rates. If the medium cannot keep up, the oldest
          data is dropped and the drop is recorded in the file header - a log that is
          quietly truncated is worse than a short one, because it looks complete.
      - name: log_event_enabled
        id: 0x060A
        type: bool
        default: 1
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Sparse event records - sync loss and gain, knock escalation, over-temperature,
          lean, overboost, rev limit, launch, shift, traction, sensor fault, watchdog,
          reset, brownout, calibration error. Pushed live as well as written, so a fault
          appears in the GUI *while it happens* rather than at the end of the session.
      - name: log_trigger_log_enabled
        id: 0x060B
        type: bool
        default: 1
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          The dense trigger log in its own format, retained in a RAM ring and drained to
          storage. It is what the trigger oscilloscope in the GUI renders with the
          decoder state overlaid.
      - name: log_map_trace_enabled
        id: 0x060C
        type: bool
        default: 1
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Record the *active* table cell - id, row, col, value and interpolation
          fractions - with every sample group. It costs a few bytes per sample and it is
          the single most useful feature for answering "why did the engine do that"
          (LOG-001 sec.5, test L8).
      - name: log_freeze_frame_enabled
        id: 0x060D
        type: bool
        default: 1
        owner: TUNER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          On a DTC, snapshot a CORE plus SLOW frame and the trigger-log window around
          the event, and store it with the code. Without it a fault is only explicable
          by the rider's memory.
      - name: log_channel_count_max
        id: 0x060E
        type: u16
        default: 120
        min: 1
        max: 1000
        owner: ENGINEER
        safety_class: MEDIUM
        default_source: UNVERIFIED
        description: >-
          Upper bound on the channel count. Bounded at read time as well as at write
          time: a log file is fixed-size records with no unbounded channel count, so a
          malformed header cannot make a reader allocate.
